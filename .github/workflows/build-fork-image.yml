# imanect-labs fork 専用のイメージビルド。
# 上流 docker.yml (multi-arch matrix + 別 org への push) とは別に、giken-cluster (amd64 Talos)
# 向けに aio ターゲット (web+workers 同梱) 単一アーキで ghcr.io/imanect-labs/karakeep へ push する。
# 認証は built-in GITHUB_TOKEN (同 org の GHCR に packages:write で push 可)。
name: Build fork image (aio)

on:
  push:
    branches:
      - main
      - feat/llm-html-translation
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/imanect-labs/karakeep
          tags: |
            type=ref,event=branch
            type=sha,format=long
            type=raw,value=translation,enable={{is_default_branch}}

      - name: Build and push (aio)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: aio
          platforms: linux/amd64
          build-args: SERVER_VERSION=fork-translation
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
